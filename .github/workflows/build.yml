name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web-Version testen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Spiellogik (JavaScript)
        run: node --test web/tests/*.test.js
