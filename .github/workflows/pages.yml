name: Web-Version veröffentlichen

# Stellt den Ordner web/ bei jedem Merge auf main als GitHub Pages online:
# https://flo-horn-sketch.github.io/Iphone-Game/
# Einmalig nötig: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Web-Version veröffentlichen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Spiellogik testen
        run: node --test web/tests/logik.test.js
      - name: Seite zusammenstellen
        run: |
          mkdir _site
          rsync -a --exclude tests web/ _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
