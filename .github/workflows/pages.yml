name: Web-Version veröffentlichen

# GitHub Pages: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Web-Version vorbereiten
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Spiellogik testen
        run: node --test web/tests/*.test.js
      - name: Seite zusammenstellen
        run: |
          mkdir _site
          rsync -a --exclude tests web/ _site/
          # Bildliste automatisch aus dem Ordner erzeugen: neue Bilder brauchen keinen Eintrag von Hand.
          python3 -c "import json,os; print(json.dumps(sorted(f for f in os.listdir('_site/grafiken') if f.lower().endswith('.png')), indent=2))" > _site/grafiken/vorhanden.json
          touch _site/.nojekyll
          # Version stempeln: die App vergleicht sie mit version.json und bietet ein Update an.
          VERSION="${GITHUB_SHA::12}"
          sed -i "s/__VERSION__/$VERSION/g" _site/airline/index.html
          printf '{"version": "%s"}\n' "$VERSION" > _site/version.json
      - name: GitHub-Pages-Paket hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Web-Version veröffentlichen
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Veröffentlichte Seite prüfen
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          test -n "$PAGES_URL"
          export CHECK_ROOT="${PAGES_URL%/}/"
          python3 - <<'PY'
          import json, os, time, urllib.request
          root = os.environ["CHECK_ROOT"]
          rev = os.environ["GITHUB_SHA"]
          for attempt in range(12):
              try:
                  def get(path, limit=None):
                      join = "&" if "?" in path else "?"
                      url = root + path + join + "verify=" + rev
                      with urllib.request.urlopen(url, timeout=10) as response:
                          return response.read() if limit is None else response.read(limit)
                  assert 'airline/' in get("").decode(), "Startseite leitet nicht zu Luftlinie"
                  assert f'airline-spiel.js?v={rev[:12]}' in get("airline/").decode(), "Luftlinie nicht auf der neuen Version"
                  assert json.loads(get("version.json"))["version"] == rev[:12], "version.json passt nicht"
                  names = set(json.loads(get("grafiken/vorhanden.json?v=3")))
                  print(f"Pages liefert Luftlinie mit {len(names)} registrierten Grafiken.")
                  break
              except Exception as exc:
                  if attempt == 11:
                      raise
                  print(f"Warte auf Pages ({attempt + 1}/12): {exc}", flush=True)
                  time.sleep(5)
          PY
