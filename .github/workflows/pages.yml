name: Web-Version veröffentlichen

# GitHub Pages: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Web-Version vorbereiten
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Spiellogik testen
        run: node --test web/tests/*.test.js
      - name: Seite zusammenstellen
        run: |
          mkdir _site
          rsync -a --exclude tests web/ _site/
          # Bildliste automatisch aus dem Ordner erzeugen: neue Bilder brauchen keinen Eintrag von Hand.
          python3 -c "import json,os; print(json.dumps(sorted(f for f in os.listdir('_site/grafiken') if f.lower().endswith('.png')), indent=2))" > _site/grafiken/vorhanden.json
          touch _site/.nojekyll
      - name: GitHub-Pages-Paket hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Web-Version veröffentlichen
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Veröffentlichte Bilddateien prüfen
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          test -n "$PAGES_URL"
          export CHECK_ROOT="${PAGES_URL%/}/"
          python3 - <<'PY'
          import json, os, struct, time, urllib.request
          root = os.environ["CHECK_ROOT"]
          rev = os.environ["GITHUB_SHA"]
          for attempt in range(12):
              try:
                  def get(path, limit=None):
                      join = "&" if "?" in path else "?"
                      url = root + path + join + "verify=" + rev
                      with urllib.request.urlopen(url, timeout=10) as response:
                          return response.read() if limit is None else response.read(limit)
                  assert 'href="clanviertel/"' in get("").decode(), "Spielauswahl nicht auf der neuen Version"
                  assert 'clan-spiel.js' in get("clanviertel/").decode(), "Clan-Viertel fehlt"
                  assert 'spiel.js?v=3' in get("fahrenden.html").decode(), "HTML nicht auf der neuen Version"
                  assert 'BILD_VERSION = "2"' in get("spiel.js?v=3").decode(), "Skript nicht auf der neuen Version"
                  names = set(json.loads(get("grafiken/vorhanden.json?v=2")))
                  for name, size in [("wagen.png", (1024, 1024)), ("karte-mittelreich.png", (1536, 1024))]:
                      assert name in names, name + " fehlt im Manifest"
                      png = get("grafiken/" + name + "?v=2", 24)
                      assert png[:8] == bytes.fromhex("89504e470d0a1a0a") and struct.unpack(">II", png[16:24]) == size, name + ": ungültiges PNG"
                  print(f"Pages liefert {len(names)} registrierte Grafiken; Wagen und Mittelreichkarte als PNG geprüft.")
                  break
              except Exception as exc:
                  if attempt == 11:
                      raise
                  print(f"Warte auf Pages ({attempt + 1}/12): {exc}", flush=True)
                  time.sleep(5)
          PY
