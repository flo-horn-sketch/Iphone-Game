name: Web-Version veröffentlichen

# GitHub Pages: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Web-Version vorbereiten
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Spiellogik testen
        run: node --test web/tests/*.test.js
      - name: Seite zusammenstellen
        run: |
          mkdir _site
          rsync -a --exclude tests web/ _site/
          touch _site/.nojekyll
      - name: GitHub-Pages-Paket hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Web-Version veröffentlichen
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
