<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clan-Viertel</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D1718">
<link rel="apple-touch-icon" href="../app-icon-180.png">
<link rel="manifest" href="../manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Festes Spielfeld 844 × 390 (iPhone quer), skaliert auf jede Bildschirmgröße. */
:root {
  --nacht: #0D1718;
  --tinte: #16211f;
  --pergament: #E8EDE6;
  --gold: #C9963A;
  --hellgold: #F3D27A;
  --jade: #3FBF8F;
  --jade-dunkel: #1d6b50;
  --natter: #D0453B;
  --natter-dunkel: #6e1f1a;
  --grau: #5b6664;
  --titel: "Cinzel", "Trajan Pro", Georgia, serif;
  --text: "Alegreya", Georgia, "Times New Roman", serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--nacht); color: var(--pergament); font-family: var(--text);
  overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none;
}
#rahmen {
  position: fixed; inset: 0;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  background: radial-gradient(ellipse at center, #1a2a28 0%, var(--nacht) 70%);
}
#feld { position: absolute; width: 844px; height: 390px; overflow: hidden; font-size: 13px;
  background: linear-gradient(180deg, #10201f, #0b1514); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { opacity: .4; cursor: default; }
.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .35; pointer-events: none; }

/* Seitenleisten */
.leiste { position: absolute; top: 6px; bottom: 6px; width: 200px; display: flex; flex-direction: column; gap: 5px; z-index: 3; }
.links { left: 6px; }
.rechts { right: 6px; }
.kopf { display: flex; align-items: center; gap: 6px; }
.rund { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none;
  background: rgba(6,12,13,.7); border: 1px solid rgba(201,150,58,.5); color: var(--hellgold); font-size: 18px; text-decoration: none; }
.clan-name { font-family: var(--titel); font-size: 14px; color: var(--jade); line-height: 1; }
.clan-name.r { color: #ff8a7a; }
.tag { margin-left: auto; font-family: var(--titel); font-size: 12px; color: var(--hellgold); text-align: right; line-height: 1.1; }
.tag small { display: block; font-family: var(--text); color: var(--pergament); opacity: .7; font-size: 11px; }
.schatz { display: flex; gap: 10px; padding: 4px 8px; border-radius: 10px; background: rgba(6,12,13,.55);
  font-family: var(--titel); font-size: 15px; align-items: center; }
.schatz span { display: flex; align-items: center; gap: 3px; }
.schatz .lager { margin-left: auto; font-family: var(--text); font-size: 11px; opacity: .75; }
.kader { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; padding-right: 2px; touch-action: pan-y; }
.karte { display: flex; align-items: center; gap: 6px; padding: 3px 6px 3px 3px; border-radius: 18px;
  background: rgba(22,33,31,.85); border: 1px solid rgba(63,191,143,.25); text-align: left; min-height: 34px; }
.karte.gewaehlt { border-color: var(--hellgold); box-shadow: 0 0 0 2px rgba(243,210,122,.5); background: rgba(40,58,50,.95); }
.karte.aus { opacity: .5; }
.karte .wer { flex: 1; min-width: 0; line-height: 1.05; }
.karte .wer b { display: block; font-size: 13px; }
.karte .wer small { font-size: 11px; opacity: .7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.karte .st { font-family: var(--titel); font-size: 17px; color: var(--hellgold); }
.jade-punkte { display: flex; gap: 2px; }
.jade-punkte i { width: 7px; height: 7px; border-radius: 2px; transform: rotate(45deg); background: #2a3b37; border: 1px solid #3d5550; }
.jade-punkte i.an { background: var(--jade); border-color: #8ff0c9; }
.aktion { display: flex; gap: 4px; }
.knopf { flex: 1; padding: 7px 6px; border-radius: 12px; background: rgba(63,191,143,.18); border: 1px solid rgba(63,191,143,.55);
  font-family: var(--titel); font-size: 12px; color: var(--pergament); }
.knopf.gold { background: rgba(201,150,58,.2); border-color: rgba(201,150,58,.6); }
.hauptknopf { font-family: var(--titel); font-weight: 700; font-size: 17px; color: var(--nacht);
  padding: 11px 10px; border-radius: 999px; background: linear-gradient(90deg, var(--gold), var(--hellgold));
  box-shadow: 0 3px 10px rgba(0,0,0,.5); }

/* Spielfiguren */
.token { position: relative; flex: none; border-radius: 50%; display: grid; place-items: center; overflow: hidden;
  background: radial-gradient(circle at 35% 30%, #2f8f6c, var(--jade-dunkel)); border: 2px solid var(--jade); }
.token.r { background: radial-gradient(circle at 35% 30%, #a3372f, var(--natter-dunkel)); border-color: var(--natter); }
.token img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.token .ic { font-size: 14px; line-height: 1; }
.token .zahl { position: absolute; right: -1px; bottom: -1px; min-width: 14px; height: 14px; padding: 0 2px; border-radius: 7px;
  background: #0b1312; color: var(--hellgold); font-family: var(--titel); font-size: 10px; line-height: 14px; text-align: center; }
.token.fuehrer { border-color: var(--hellgold); }
.token.verletzt { filter: grayscale(.8) brightness(.7); }

/* Stadtkarte: eine gemalte Insel (clan-karte.png), darauf die neun Viertel als Orte */
.stadt { position: absolute; left: 230px; top: 6px; width: 384px; height: 378px; z-index: 2; border-radius: 16px; overflow: hidden;
  background: radial-gradient(ellipse at 50% 40%, #1d4a52, #0a2026 75%); box-shadow: inset 0 0 30px rgba(0,0,0,.6); }
.stadt .karte-bild, .stadt .karte-ersatz { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.stadt .wege { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.viertel { position: absolute; width: 104px; height: 92px; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center;
  transition: opacity .2s, transform .15s; cursor: pointer; }
.viertel .scheibe { position: relative; width: 50px; height: 50px; border-radius: 50%; overflow: hidden; border: 3px solid var(--grau);
  background: radial-gradient(circle at 40% 35%, #3b4d4a, #18221f); display: grid; place-items: center; box-shadow: 0 3px 10px rgba(0,0,0,.6); }
.viertel.p .scheibe { border-color: var(--jade); box-shadow: 0 0 12px rgba(63,191,143,.55), 0 3px 10px rgba(0,0,0,.6); }
.viertel.r .scheibe { border-color: var(--natter); box-shadow: 0 0 12px rgba(208,69,59,.55), 0 3px 10px rgba(0,0,0,.6); }
.viertel .scheibe img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.viertel .wappen { font-size: 22px; }
.viertel .name { margin-top: 2px; padding: 1px 7px; border-radius: 8px; font-family: var(--titel); font-size: 10px; letter-spacing: .4px; white-space: nowrap;
  background: rgba(5,10,10,.78); }
.viertel .ertrag { position: absolute; left: 50%; top: 13px; transform: translateX(28px); font-size: 9.5px; padding: 0 4px; border-radius: 7px; background: rgba(5,10,10,.75); white-space: nowrap; }
.laternen { display: flex; gap: 3px; height: 14px; margin-bottom: 1px; }
.laterne { width: 9px; height: 12px; border-radius: 4px 4px 5px 5px; background: #222b2a; border: 1px solid #3c4746; position: relative; }
.laterne::before { content: ""; position: absolute; left: 2.5px; top: -3px; width: 2px; height: 3px; background: #3c4746; }
.laterne.p { background: radial-gradient(circle at 50% 45%, #b6ffe0, var(--jade)); border-color: #8ff0c9; box-shadow: 0 0 7px var(--jade); }
.laterne.r { background: radial-gradient(circle at 50% 45%, #ffc1b8, var(--natter)); border-color: #ff9d92; box-shadow: 0 0 7px var(--natter); }
.laterne.neu { animation: aufleuchten .9s ease-out; }
@keyframes aufleuchten { 0% { transform: scale(2.2); filter: brightness(2.5); } 100% { transform: scale(1); } }
.reihe-p, .reihe-r { position: absolute; top: 16px; display: flex; flex-direction: column; gap: 1px; }
.reihe-p { right: calc(50% + 27px); align-items: flex-end; }
.reihe-r { left: calc(50% + 27px); align-items: flex-start; top: 28px; }
.reihe-p .zeile, .reihe-r .zeile { display: flex; gap: 1px; }
.mehr { font-family: var(--titel); font-size: 10px; padding: 0 3px; border-radius: 6px; background: rgba(5,10,10,.8); }
.wert { position: absolute; left: 50%; top: 52px; transform: translateX(-62px); padding: 0 5px; border-radius: 8px; background: rgba(15,60,45,.95);
  border: 1px solid var(--jade); font-family: var(--titel); font-size: 11px; color: #c9ffe9; white-space: nowrap; }
.viertel.erreichbar .scheibe { box-shadow: 0 0 0 3px rgba(243,210,122,.9), 0 0 16px rgba(243,210,122,.6); }
.stadt.waehlen .viertel:not(.erreichbar) { opacity: .4; }
.viertel.ansage .scheibe { animation: ansage 1.6s ease-in-out infinite; }
@keyframes ansage { 0%,100% { box-shadow: 0 0 0 2px rgba(208,69,59,.4); } 50% { box-shadow: 0 0 0 5px rgba(208,69,59,.95), 0 0 20px rgba(208,69,59,.7); } }
.ziel { position: absolute; left: 50%; top: 36px; transform: translateX(-50%); display: flex; align-items: center; gap: 3px; z-index: 3;
  padding: 0 6px; border-radius: 9px; background: rgba(110,31,26,.95); border: 1px solid var(--natter); font-family: var(--titel); font-size: 10.5px; white-space: nowrap; }
.ziel.spaeher { background: rgba(30,40,60,.95); border-color: #8fb3ff; }
.frieden { position: absolute; left: 50%; top: 88px; transform: translateX(-50%); font-size: 9.5px; padding: 0 5px; border-radius: 7px; background: rgba(5,10,10,.8); white-space: nowrap; z-index: 2; }
.viertel.fokus { transform: translate(-50%, -50%) scale(1.15); z-index: 5; }
.viertel.fokus .scheibe { box-shadow: 0 0 0 3px var(--hellgold), 0 0 24px rgba(243,210,122,.8); }

/* Rivale */
.rivale { display: flex; gap: 7px; align-items: flex-start; }
.portrait { width: 58px; height: 58px; border-radius: 50%; flex: none; overflow: hidden; border: 2px solid var(--natter);
  background: radial-gradient(circle at 40% 30%, #8d2f28, #2a0e0c); display: grid; place-items: center; font-size: 28px; position: relative; }
.portrait img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.portrait.p { border-color: var(--jade); background: radial-gradient(circle at 40% 30%, #2f8f6c, #0b2a20); }
.sprechblase { position: relative; flex: 1; padding: 6px 8px; border-radius: 10px; background: var(--pergament); color: #1b2423;
  font-size: 12.5px; line-height: 1.2; min-height: 40px; }
.sprechblase::before { content: ""; position: absolute; left: -6px; top: 14px; border: 6px solid transparent; border-left: 0; border-right-color: var(--pergament); }
.sprechblase b { color: #9e2b23; }
.r-kader { display: flex; flex-wrap: wrap; gap: 4px; padding: 5px; border-radius: 10px; background: rgba(6,12,13,.55); }
.info-zeile { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 6px; border-radius: 8px; background: rgba(6,12,13,.5); }
.fortschritt { display: grid; grid-template-columns: auto 1fr; gap: 2px 6px; align-items: center; font-size: 11px; padding: 5px 7px; border-radius: 10px; background: rgba(6,12,13,.55); }
.balken { display: flex; gap: 2px; }
.balken i { flex: 1; height: 7px; border-radius: 2px; background: #273331; }
.balken.p i.an { background: var(--jade); }
.balken.r i.an { background: var(--natter); }
.krieg { padding: 4px 7px; border-radius: 8px; background: rgba(208,69,59,.25); border: 1px solid var(--natter); font-size: 12px; text-align: center; }
.spacer { flex: 1; }

/* Auflösung */
.duell { position: absolute; z-index: 20; left: 50%; top: 50%; transform: translate(-50%,-50%); display: flex; align-items: center; gap: 12px;
  padding: 8px 16px; border-radius: 16px; background: rgba(5,10,10,.92); border: 2px solid var(--hellgold); box-shadow: 0 6px 24px #000;
  font-family: var(--titel); white-space: nowrap; animation: auf .25s ease-out; }
.duell .seite { display: flex; flex-direction: column; align-items: center; min-width: 74px; }
.duell .zahl { font-size: 34px; line-height: 1; }
.duell .p .zahl { color: var(--jade); }
.duell .r .zahl { color: #ff7d70; }
.duell .klein { font-family: var(--text); font-size: 11px; opacity: .8; }
.duell .vs { font-size: 22px; color: var(--hellgold); }
.stempel { position: absolute; z-index: 21; left: 50%; top: 50%; transform: translate(-50%,-50%) rotate(-6deg); padding: 6px 16px; border-radius: 10px;
  font-family: var(--titel); font-size: 22px; font-weight: 700; white-space: nowrap; border: 3px solid; animation: stempel .35s cubic-bezier(.3,1.8,.5,1); box-shadow: 0 4px 18px #000; }
.stempel.gut { color: #c9ffe9; border-color: var(--jade); background: rgba(15,60,45,.95); }
.stempel.schlecht { color: #ffd0ca; border-color: var(--natter); background: rgba(80,20,16,.95); }
.stempel.neutral { color: var(--hellgold); border-color: var(--gold); background: rgba(40,32,12,.95); }
.stempel small { display: block; font-family: var(--text); font-size: 13px; font-weight: 400; text-align: center; }
@keyframes stempel { 0% { transform: translate(-50%,-50%) rotate(-6deg) scale(2.2); opacity: 0; } 100% { transform: translate(-50%,-50%) rotate(-6deg) scale(1); opacity: 1; } }
@keyframes auf { from { opacity: 0; transform: translate(-50%,-50%) scale(.8); } to { opacity: 1; transform: translate(-50%,-50%) scale(1); } }
.schleier { position: absolute; inset: 0; z-index: 30; background: rgba(4,8,8,.72); display: grid; place-items: center; }
.tafel { width: 470px; max-height: 360px; overflow-y: auto; padding: 14px 18px; border-radius: 16px; background: linear-gradient(170deg, #1d2c29, #111b19);
  border: 1px solid rgba(201,150,58,.6); box-shadow: 0 10px 30px #000; display: flex; flex-direction: column; gap: 8px; text-align: center; animation: auf2 .25s ease-out; }
@keyframes auf2 { from { opacity: 0; transform: scale(.9); } }
.tafel h2 { margin: 0; font-family: var(--titel); color: var(--hellgold); font-size: 20px; }
.tafel p { margin: 0; line-height: 1.35; }
.tafel .bild-gross { height: 120px; border-radius: 10px; overflow: hidden; background: linear-gradient(160deg, #263533, #16211f); display: grid; place-items: center; font-size: 46px; position: relative; }
.tafel .bild-gross img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.wahl { display: flex; gap: 8px; }
.wahl button { flex: 1; padding: 9px; border-radius: 12px; border: 1px solid rgba(201,150,58,.6); background: rgba(201,150,58,.14); font-family: var(--titel); font-size: 14px; }
.wahl .hauptknopf { background: linear-gradient(90deg, var(--gold), var(--hellgold)); color: var(--nacht); border: 0; }
.wahl button small { display: block; font-family: var(--text); font-size: 12px; opacity: .85; }
.bilanz { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; font-size: 15px; }
.bilanz span { display: flex; align-items: center; gap: 4px; }
.typwahl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.typwahl button { padding: 8px 6px; border-radius: 12px; border: 1px solid rgba(63,191,143,.5); background: rgba(63,191,143,.12); display: flex; flex-direction: column; align-items: center; gap: 4px; }
.typwahl button b { font-family: var(--titel); font-size: 13px; }
.typwahl button small { font-size: 11px; line-height: 1.2; opacity: .85; }
.rivalwahl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rivalwahl button { padding: 8px; border-radius: 12px; border: 1px solid rgba(208,69,59,.5); background: rgba(208,69,59,.1); display: flex; flex-direction: column; align-items: center; gap: 4px; }
.rivalwahl button.an { border-color: var(--hellgold); background: rgba(201,150,58,.2); }
.rivalwahl button b { font-family: var(--titel); font-size: 13px; }
.rivalwahl button small { font-size: 11px; line-height: 1.2; opacity: .85; }
.rivalwahl button:disabled { opacity: .35; }

/* Einführung */
.tipp { position: absolute; z-index: 40; max-width: 300px; padding: 8px 12px; border-radius: 12px; background: var(--pergament); color: #1b2423;
  font-size: 14px; line-height: 1.25; box-shadow: 0 6px 20px rgba(0,0,0,.6); animation: auf2 .3s ease-out; }
.tipp b { color: var(--jade-dunkel); }
.tipp button { margin-top: 6px; padding: 4px 14px; border-radius: 999px; background: var(--jade-dunkel); color: #fff; font-family: var(--titel); font-size: 12px; }
.hand { position: absolute; z-index: 41; font-size: 30px; pointer-events: none; filter: drop-shadow(0 2px 3px #000); }
.hand.tippen { animation: tippen 1s ease-in-out infinite; }
@keyframes tippen { 0%,100% { transform: translate(0,0); } 50% { transform: translate(4px,8px) scale(.9); } }
.zieh-geist { position: absolute; z-index: 50; pointer-events: none; opacity: .9; transform: translate(-50%,-50%) scale(1.2); }
.flug { position: absolute; z-index: 25; font-family: var(--titel); font-size: 16px; color: var(--hellgold); pointer-events: none; text-shadow: 0 1px 4px #000;
  animation: flug 1.4s ease-out forwards; white-space: nowrap; }
@keyframes flug { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-34px); } }

/* Start */
.start { position: absolute; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  background: radial-gradient(ellipse at 50% 15%, #1f3a33, #0a1312 72%); text-align: center; padding: 16px; }
.start h1 { margin: 0; font-family: var(--titel); color: var(--hellgold); font-size: 30px; letter-spacing: 2px; }
.start p { margin: 0; max-width: 520px; line-height: 1.4; }
.start .bg { opacity: .3; }

#drehen { position: fixed; inset: 0; z-index: 100; display: none; place-content: center; justify-items: center; gap: 14px; text-align: center;
  background: var(--nacht); padding: 24px; font-family: var(--titel); font-size: 18px; }
#drehen .telefon { width: 46px; height: 80px; border: 3px solid var(--hellgold); border-radius: 10px; animation: drehen 2s ease-in-out infinite; }
@keyframes drehen { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
@media (orientation: portrait) and (max-width: 700px) { #drehen { display: grid; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; transition: none !important; } }
</style>

<div id="rahmen"><div id="feld"></div></div>
<div id="drehen" role="status"><div class="telefon"></div><div>Dreh dein iPhone quer</div></div>

<script src="clan-logik.js?v=2" charset="utf-8"></script>
<script src="clan-spiel.js?v=2" charset="utf-8"></script>
</html>
