<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="luftlinie-version" content="__VERSION__">
<title>Airlines</title>
<meta name="apple-mobile-web-app-title" content="Airlines">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B1622">
<link rel="apple-touch-icon" href="../app-icon-180.png">
<link rel="manifest" href="../manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap">
<style>
/* Festes Spielfeld 844 × 390 (iPhone quer), skaliert auf jede Bildschirmgröße. */
:root {
  --nacht: #0B1622;
  --meer: #10263A;
  --meer2: #0D2033;
  --land: #2A4A4E;
  --land-rand: #5E8C84;
  --tafel: rgba(9, 18, 28, .88);
  --linie: rgba(160, 200, 230, .22);
  --text: #EAF2F8;
  --blass: #9FB4C4;
  --gold: #F2C14E;
  --gruen: #4ADE80;
  --rot: #F87171;
  --gelb: #FACC15;
  --schrift: "Outfit", "Avenir Next", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--nacht); color: var(--text); font-family: var(--schrift);
  overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none;
}
#rahmen {
  position: fixed; inset: 0;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  background: var(--nacht);
}
#feld { position: absolute; left: 0; top: 0; width: 844px; height: 390px; transform-origin: 0 0; --sl: 0px; --sr: 0px; --st: 0px; --sb: 0px; overflow: hidden; font-size: 12px; background: var(--meer); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { opacity: .4; cursor: default; }
.zahl { font-variant-numeric: tabular-nums; }
.plus { color: var(--gruen); }
.minus { color: var(--rot); }

/* Karte */
#karte { position: absolute; inset: 0; width: 100%; height: 100%; display: block; transform-origin: 0 0; will-change: transform; }
#karte .land { fill: var(--land); stroke: var(--land-rand); stroke-width: .6; }
#karte .grenze { fill: none; stroke: rgba(160, 210, 200, .18); stroke-width: .5; }
#karte .netz { fill: none; stroke: rgba(255,255,255,.035); stroke-width: .5; }
.stadt-punkt { stroke: #0B1622; }
.stadt-name { font-family: var(--schrift); font-weight: 600; fill: #DCE8EF; paint-order: stroke; stroke: rgba(8,16,24,.85); stroke-linejoin: round; pointer-events: none; }
.route-ziel { stroke: transparent; fill: none; }
.preis-schild rect { fill: rgba(9,18,28,.86); }
.preis-schild text { font-family: var(--schrift); font-weight: 800; text-anchor: middle; dominant-baseline: central; }
.puls { animation: puls 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes puls { 50% { opacity: .25; transform: scale(1.6); } }
.flieger { pointer-events: none; }
.landung { font-family: var(--schrift); font-weight: 800; fill: var(--gruen); paint-order: stroke; stroke: #06101a; text-anchor: middle; pointer-events: none; animation: hoch 1.6s ease-out forwards; }
.landung.minus { fill: var(--rot); }
@keyframes hoch { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-14px); } }

/* Kopfleiste */
.oben { position: absolute; top: calc(6px + var(--st)); left: calc(6px + var(--sl)); right: calc(6px + var(--sr)); height: 38px; display: flex; gap: 6px; align-items: stretch; z-index: 5; pointer-events: none; }
.oben > * { pointer-events: auto; }
.kachel { background: var(--tafel); border: 1px solid var(--linie); border-radius: 12px; display: flex; align-items: center; gap: 8px; padding: 0 10px; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
.rundknopf { width: 38px; justify-content: center; padding: 0; font-size: 17px; text-decoration: none; color: var(--text); }
.tonknopf.aus { opacity: .55; }
.tonfenster { position: absolute; top: calc(48px + var(--st)); right: calc(50px + var(--sr)); z-index: 8; width: 220px; background: var(--tafel); border: 1px solid var(--linie); border-radius: 14px; padding: 5px;
  display: flex; flex-direction: column; gap: 2px; box-shadow: 0 8px 26px rgba(0,0,0,.5); animation: rein .2s ease-out; }
.ton-zeile { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 9px; font-weight: 600; font-size: 13px; text-align: left; }
.ton-zeile .gross-icon { width: 24px; text-align: center; }
.ton-zeile > span:nth-child(2) { flex: 1; }
.ton-zeile .schieber { width: 38px; height: 22px; border-radius: 11px; background: rgba(255,255,255,.18); position: relative; transition: background .15s; }
.ton-zeile .schieber i { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .15s; }
.ton-zeile.an .schieber { background: #3FB950; }
.ton-zeile.an .schieber i { left: 18px; }
.geld { flex-direction: row; align-items: center; justify-content: flex-start; gap: 7px; min-width: 120px; }
.geld-spalte { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 0; }
.hud-chef[hidden] { display: none; }
.hud-chef .mgr-gesicht { width: 34px; height: 34px; }
.geld b { font-size: 17px; line-height: 1.05; }
.geld small { font-size: 10px; color: var(--blass); }
.airline-name { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 13px; }
.punkt { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.uhr { flex-direction: column; align-items: stretch; justify-content: center; gap: 3px; min-width: 128px; }
.uhr .zeile { display: flex; justify-content: space-between; gap: 6px; font-weight: 600; }
.uhr .balken { height: 4px; border-radius: 2px; background: rgba(255,255,255,.12); overflow: hidden; }
.uhr .balken i { display: block; height: 100%; background: var(--gold); }
.tempo { padding: 0 4px; gap: 2px; }
.tempo button { width: 34px; height: 30px; border-radius: 8px; font-size: 13px; letter-spacing: -2px; }
.tempo button.an { background: var(--gold); color: #1a1205; }
.luecke { flex: 1; }
.abzeichen { position: absolute; top: -5px; right: -5px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--gold); color: #1a1205; font-size: 10px; font-weight: 800; display: grid; place-items: center; padding: 0 3px; }
.knopf-mit { position: relative; }
.platz { font-weight: 800; font-size: 14px; }

/* Warnstufe Pleite */
.warnung { position: absolute; top: 50px; left: 50%; transform: translateX(-50%); z-index: 6; display: flex; gap: 10px; align-items: center;
  background: rgba(120, 20, 20, .92); border: 1px solid var(--rot); border-radius: 12px; padding: 6px 12px; font-weight: 600; }
.warnung .stufen { display: flex; gap: 4px; }
.warnung .stufen i { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.25); }
.warnung .stufen i.an { background: var(--rot); box-shadow: 0 0 6px var(--rot); }
.warnung button { background: #fff; color: #5a0d0d; border-radius: 8px; padding: 4px 10px; font-weight: 800; }

/* Gelegenheiten links */
.gelegenheiten { position: absolute; left: calc(6px + var(--sl)); top: calc(50px + var(--st)); width: 214px; display: flex; flex-direction: column; gap: 6px; z-index: 4; }
.gel { position: relative; overflow: hidden; background: var(--tafel); border: 1px solid rgba(242,193,78,.55); border-radius: 12px; display: flex; gap: 8px; padding: 7px; animation: rein .35s ease-out; }
.gel.info { border-color: var(--linie); }
@keyframes rein { from { transform: translateX(-30px); opacity: 0; } }
.gel .bildchen { width: 46px; height: 46px; border-radius: 9px; flex: none; display: grid; place-items: center; font-size: 24px; background: rgba(255,255,255,.07); overflow: hidden; }
.gel .bildchen img { width: 100%; height: 100%; object-fit: cover; }
.gel .inhalt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.gel .titel { font-weight: 800; font-size: 12px; line-height: 1.15; }
.gel .klein { color: var(--blass); font-size: 10.5px; line-height: 1.2; }
.gel .knoepfe { display: flex; gap: 5px; margin-top: auto; }
.gel .knoepfe button { border-radius: 7px; padding: 3px 8px; font-weight: 800; font-size: 11px; background: rgba(255,255,255,.1); }
.gel .knoepfe button.ja { background: var(--gold); color: #1a1205; }
.gel .rest { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--gold); }

/* Seitentafel rechts */
.tafel { position: absolute; right: calc(6px + var(--sr)); top: calc(50px + var(--st)); bottom: calc(6px + var(--sb)); width: 262px; z-index: 6; background: var(--tafel); border: 1px solid var(--linie);
  border-radius: 14px; box-shadow: 0 8px 26px rgba(0,0,0,.45); display: flex; flex-direction: column; overflow: hidden; animation: tafelRein .2s ease-out; }
@keyframes tafelRein { from { transform: translateX(24px); opacity: 0; } }
.tafel .kopf { display: flex; align-items: center; gap: 8px; padding: 9px 10px 6px; }
.tafel .kopf h2 { margin: 0; font-size: 15px; font-weight: 800; flex: 1; line-height: 1.1; }
.tafel .kopf h2 small { display: block; font-size: 10.5px; font-weight: 400; color: var(--blass); margin-top: 2px; }
.tafel .zu { width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,.08); font-size: 14px; }
.tafel .rumpf { flex: 1; overflow-y: auto; padding: 0 10px 10px; display: flex; flex-direction: column; gap: 7px; touch-action: pan-y; }
.tafel .rumpf > * { flex-shrink: 0; }
.gross { font-size: 26px; font-weight: 800; line-height: 1; }
.zeile { display: flex; align-items: center; gap: 6px; }
.zeile .rechts { margin-left: auto; }
.blass { color: var(--blass); }
.mini { font-size: 10.5px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 10px; background: rgba(255,255,255,.08); font-size: 10.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.wahl { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 10px; background: rgba(255,255,255,.06); border: 1px solid transparent; text-align: left; width: 100%; }
.wahl:not(:disabled):active { transform: scale(.98); }
.wahl.gut { border-color: rgba(74,222,128,.5); }
.wahl.schlecht { border-color: rgba(248,113,113,.4); }
.wahl .ic { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; font-size: 18px; background: rgba(255,255,255,.07); flex: none; overflow: hidden; }
.wahl .ic img { width: 100%; height: 100%; object-fit: cover; }
.wahl .mitte { flex: 1; min-width: 0; }
.wahl .mitte b { display: block; font-size: 12px; }
.wahl .mitte span { font-size: 10.5px; color: var(--blass); }
.wahl .wert { text-align: right; font-weight: 800; font-size: 13px; }
.wahl .wert small { display: block; font-weight: 400; font-size: 10px; color: var(--blass); }
.hauptknopf { background: var(--gold); color: #1a1205; border-radius: 10px; padding: 8px 10px; font-weight: 800; font-size: 13px; width: 100%; }
.nebenknopf { background: rgba(255,255,255,.09); border-radius: 10px; padding: 7px 10px; font-weight: 600; font-size: 12px; }
.nebenknopf.warnknopf { background: #C8503C; color: #fff; }
.knopfreihe { display: flex; gap: 6px; }
.knopfreihe > * { flex: 1; }
.segment { display: flex; background: rgba(255,255,255,.06); border-radius: 10px; padding: 3px; gap: 3px; }
.segment button { flex: 1; border-radius: 8px; padding: 6px 2px; font-weight: 600; font-size: 11px; line-height: 1.1; }
.segment button small { display: block; font-size: 9.5px; font-weight: 400; opacity: .75; }
.segment button.an { background: var(--gold); color: #1a1205; }
.balkenzeile { display: grid; grid-template-columns: 70px 1fr 46px; align-items: center; gap: 6px; font-size: 10.5px; }
.balkenzeile .spur { height: 9px; border-radius: 5px; background: rgba(255,255,255,.07); overflow: hidden; }
.balkenzeile .spur i { display: block; height: 100%; border-radius: 5px; }
.balkenzeile .betrag { text-align: right; }
.auslastung { height: 12px; border-radius: 6px; background: rgba(255,255,255,.08); overflow: hidden; position: relative; }
.auslastung i { display: block; height: 100%; }
.auslastung span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 9.5px; font-weight: 800; }
.hinweis { background: rgba(242,193,78,.12); border: 1px solid rgba(242,193,78,.35); border-radius: 10px; padding: 6px 8px; font-size: 11px; line-height: 1.25; }
.hinweis.gruen { background: rgba(74,222,128,.1); border-color: rgba(74,222,128,.35); }
.rang { display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 10px; background: rgba(255,255,255,.05); }
.rang.ich { background: rgba(242,193,78,.14); }
.rang .nr { width: 20px; font-weight: 800; font-size: 15px; text-align: center; }
.rang .gesicht { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; flex: none; font-weight: 800; color: #0b1622; font-size: 15px; }
.rang .gesicht img { width: 100%; height: 100%; object-fit: cover; }
.rang .mitte { flex: 1; min-width: 0; }
.rang .mitte b { display: block; font-size: 12px; }
.rang .mitte .spur { height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); margin-top: 3px; overflow: hidden; }
.rang .mitte .spur i { display: block; height: 100%; }
.spruch { font-style: italic; font-size: 10.5px; color: var(--blass); }

/* Tagesabschluss */
.abschluss { position: absolute; left: 50%; bottom: calc(8px + var(--sb)); transform: translateX(-50%); z-index: 5; background: var(--tafel); border: 1px solid var(--linie);
  border-radius: 14px; padding: 7px 12px; display: flex; gap: 12px; align-items: center; box-shadow: 0 6px 20px rgba(0,0,0,.45); animation: abschluss 6s ease forwards; pointer-events: none; }
@keyframes abschluss { 0% { opacity: 0; transform: translate(-50%, 20px); } 6%, 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, 10px); } }
.abschluss .gross { font-size: 22px; }
.abschluss .liste { display: flex; flex-direction: column; gap: 1px; font-size: 10.5px; }

/* Meldungen */
.meldung { position: absolute; left: 50%; top: calc(50px + var(--st)); transform: translateX(-50%); z-index: 7; max-width: 380px; background: var(--tafel); border: 1px solid var(--gold);
  border-radius: 12px; padding: 7px 12px; display: flex; gap: 8px; align-items: center; font-weight: 600; animation: meldung 4.2s ease forwards; pointer-events: none; }
@keyframes meldung { 0% { opacity: 0; transform: translate(-50%, -10px); } 8%, 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }

/* Einführung */
.tipp { position: absolute; z-index: 8; max-width: 250px; background: #FFF6DA; color: #1E1A0E; border-radius: 12px; padding: 8px 11px; font-size: 12.5px; font-weight: 600; line-height: 1.25;
  box-shadow: 0 6px 22px rgba(0,0,0,.5); animation: rein .3s ease-out; }
.tipp::after { content: ""; position: absolute; width: 12px; height: 12px; background: #FFF6DA; transform: rotate(45deg); }
.tipp.pfeil-oben::after { top: -5px; left: 22px; }
.tipp.pfeil-rechts::after { right: -5px; top: 14px; }
.tipp.pfeil-unten::after { bottom: -5px; left: 22px; }
.tipp.pfeil-links::after { left: -5px; top: 14px; }
.tipp { pointer-events: none; }
.tipp button { pointer-events: auto; margin-top: 5px; background: #1E1A0E; color: #FFF6DA; border-radius: 8px; padding: 3px 10px; font-weight: 800; font-size: 11px; }

/* Vollbild-Seiten: Start, Ende, Übernahme */
.seite { position: absolute; inset: 0; z-index: 10; background: radial-gradient(ellipse at 50% 0%, #1d3a58 0%, var(--nacht) 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: calc(14px + var(--st)) calc(14px + var(--sr)) calc(14px + var(--sb)) calc(14px + var(--sl)); box-sizing: border-box; }
.seite .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .38; pointer-events: none; }
.seite > *:not(.bg) { position: relative; }
.seite h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: 1px; }
.seite h1 small { display: block; font-size: 13px; font-weight: 400; color: var(--blass); letter-spacing: 0; text-align: center; }
.karten { display: flex; gap: 10px; }
.karte-wahl { width: 200px; border-radius: 14px; overflow: hidden; background: var(--tafel); border: 2px solid var(--linie); text-align: left; display: flex; flex-direction: column; }
.karte-wahl.an { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(242,193,78,.25); }
.karte-wahl .bild { height: 92px; display: grid; place-items: center; font-size: 40px; background: rgba(255,255,255,.05); overflow: hidden; }
.karte-wahl .bild img { width: 100%; height: 100%; object-fit: cover; }
.karte-wahl .txt { padding: 7px 9px 9px; }
.karte-wahl .txt b { font-size: 15px; display: block; }
.karte-wahl .txt span { font-size: 11px; color: var(--blass); line-height: 1.2; display: block; margin-top: 2px; }
.namen { display: flex; gap: 8px; align-items: center; }
.namen button { border-radius: 18px; padding: 6px 12px; font-weight: 800; background: rgba(255,255,255,.08); border: 2px solid transparent; display: flex; align-items: center; gap: 6px; }
.namen button.an { border-color: var(--gold); }
.seite .hauptknopf { width: auto; padding: 10px 26px; font-size: 15px; }
.heimatwahl { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); z-index: 9; text-align: center; background: var(--tafel); border: 1px solid var(--gold); border-radius: 12px; padding: 7px 14px; font-weight: 800; }
.heimatwahl small { display: block; font-weight: 400; color: var(--blass); }


/* ---------- Neue Oberfläche (Fassung 2) ---------- */
.zu { width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,.08); font-size: 14px; flex: none; }
.kerosin { font-size: 10px; }
.tempoknopf { width: 50px; justify-content: center; padding: 0; font-weight: 800; font-size: 13px; letter-spacing: -2px; color: var(--gold); }
.tempoknopf.pause { background: var(--gold); color: #1a1205; border-color: var(--gold); animation: atmen 1.6s ease-in-out infinite; }
@keyframes atmen { 50% { box-shadow: 0 0 0 4px rgba(242,193,78,.3); } }
.treppchen { gap: 6px; padding: 0 9px; position: relative; }
.stufen-bild { display: flex; align-items: flex-end; gap: 2px; height: 16px; }
.stufen-bild i { width: 6px; border-radius: 2px 2px 0 0; background: rgba(255,255,255,.25); }
.stufen-bild i.an { background: var(--gold); }
.treppchen b { font-size: 15px; }
.linienknopf { font-weight: 800; font-size: 13px; padding: 0 12px; border-color: rgba(242,193,78,.55); }

/* Ziel unten */
.zielleiste { position: absolute; left: 50%; bottom: calc(6px + var(--sb)); transform: translateX(-50%); z-index: 5; width: 470px; height: 36px; display: flex; align-items: center; gap: 9px; padding: 0 10px;
  background: var(--tafel); border: 1px solid rgba(242,193,78,.5); border-radius: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.35); text-align: left; }
.zielnr { font-size: 17px; }
.zieltext { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.zieltext b { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.zieltext .spur { height: 5px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
.zieltext .spur i { display: block; height: 100%; background: var(--gold); border-radius: 3px; transition: width .4s; }
.zielzahl { font-weight: 800; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.praemie { background: rgba(242,193,78,.16); color: var(--gold); border-radius: 9px; padding: 3px 8px; font-weight: 800; font-size: 11px; white-space: nowrap; }
.abschluss { bottom: 48px; }
.editor-an .zielleiste { display: none; }
.tafel-an .zielleiste { left: calc(50% - 140px); width: 440px; }
.editor-an .meldung { top: 92px; }

/* Menü */
.menue { position: absolute; top: calc(48px + var(--st)); right: calc(6px + var(--sr)); z-index: 8; width: 210px; background: var(--tafel); border: 1px solid var(--linie); border-radius: 14px; padding: 5px;
  display: flex; flex-direction: column; gap: 2px; box-shadow: 0 8px 26px rgba(0,0,0,.5); animation: rein .2s ease-out;
  max-height: calc(100% - 56px - var(--st) - var(--sb)); overflow-y: auto; }
.menue-punkt { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 9px; font-weight: 600; font-size: 13px; text-align: left; }
.menue-punkt:active { background: rgba(255,255,255,.08); }
.menue-punkt .gross-icon { width: 24px; text-align: center; }

/* Store */
.seite.store { justify-content: flex-start; gap: 8px; padding: 10px 12px; }
.store-kopf { display: flex; align-items: center; gap: 12px; width: 100%; }
.store-kopf h1 { font-size: 20px; flex: 1; letter-spacing: 0; }
.store-geld { font-weight: 800; color: var(--gold); }
.store-reihe { display: flex; gap: 9px; width: 100%; flex: 1; min-height: 0; }

/* Linien-Editor */
.editor { position: absolute; left: calc(6px + var(--sl)); top: calc(50px + var(--st)); bottom: calc(6px + var(--sb)); width: 214px; z-index: 6; display: flex; flex-direction: column; gap: 6px;
  background: var(--tafel); border: 1px solid rgba(242,193,78,.55); border-radius: 14px; padding: 7px; box-sizing: border-box; box-shadow: 0 8px 26px rgba(0,0,0,.45); animation: rein .2s ease-out; }

.editor-titel { flex: 1; font-weight: 800; font-size: 13px; }
.editor-mitte { position: absolute; left: 222px; top: 0; width: 340px; text-align: center; background: var(--gold); color: #1a1205; font-weight: 800; font-size: 13px;
  border-radius: 12px; padding: 7px 10px; box-shadow: 0 4px 14px rgba(0,0,0,.4); box-sizing: border-box; pointer-events: none; }
.editor-liste { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; touch-action: pan-y; }
.editor-liste > * { flex-shrink: 0; }
.wahl.an { border-color: var(--gold); background: rgba(242,193,78,.12); }
.wahl.neu { justify-content: center; border: 1px dashed rgba(242,193,78,.6); }
.plus-gross { font-size: 18px; font-weight: 800; color: var(--gold); }
.tafel.im-editor { border-color: rgba(242,193,78,.55); }
.hauptknopf.klein { width: auto; padding: 5px 12px; font-size: 12px; }
.gross-knopf { padding: 11px 10px; font-size: 14px; }
.mitte-text { text-align: center; }

.legende { display: flex; flex-wrap: wrap; gap: 3px 9px; font-size: 9.5px; color: var(--blass); }

/* Symbole statt Zahlen */
.symbolzeile { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
.symbol { display: flex; flex-direction: column; align-items: center; gap: 1px; background: rgba(255,255,255,.06); border-radius: 10px; padding: 5px 2px; }

.sitzplan { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 0; }

.stapel { display: flex; flex-direction: column; gap: 4px; }

/* Flugzeuge einer Linie */

.plus-knopf { font-size: 16px; font-weight: 800; color: var(--gruen); border: 1px solid rgba(74,222,128,.5); }

/* Sitzaufteilung */
.klassen { display: flex; flex-direction: column; gap: 5px; background: rgba(255,255,255,.04); border-radius: 10px; padding: 6px; }

/* Regelkarten */

.berater { position: absolute; z-index: 6; width: 250px; background: rgba(12,24,38,.96); border: 1px solid var(--gold); border-radius: 14px; padding: 8px 10px 9px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 8px 26px rgba(0,0,0,.55); animation: rein .3s ease-out; transition: opacity .15s; }
.berater::after { content: ""; position: absolute; left: calc(var(--zipfel, 125px) - 7px); bottom: -7px; width: 12px; height: 12px; background: rgba(12,24,38,.96); border-right: 1px solid var(--gold); border-bottom: 1px solid var(--gold); transform: rotate(45deg); }

.ergebnis-seite { background: rgba(6,14,26,.72); }
.ergebnis-karte { width: 440px; max-width: 100%; background: var(--tafel); border: 1px solid rgba(255,255,255,.15); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 12px 40px rgba(0,0,0,.6); animation: rein .3s ease-out; }

.ergebnis-kopf { display: flex; align-items: center; gap: 10px; }

.ergebnis-icon { font-size: 32px; width: 40px; height: 40px; display: grid; place-items: center; }
.gebote { display: flex; flex-direction: column; gap: 5px; }
.gebot { display: grid; grid-template-columns: 10px 92px 1fr 74px 20px; align-items: center; gap: 7px; font-size: 12px; padding: 4px 6px; border-radius: 8px; }

.regelkarte { width: 620px; height: 270px; display: flex; background: var(--tafel); border: 1px solid var(--gold); border-radius: 18px; overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,.6); animation: rein .3s ease-out; }
.regelbild { position: relative; width: 290px; flex: none; display: grid; place-items: center; font-size: 80px; background: linear-gradient(160deg, #24496a, #10202f); }
.regelbild img { width: 100%; height: 100%; object-fit: cover; }
.chefs { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 8px; }
.chefs .gesicht { width: 46px; height: 46px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; font-size: 18px; font-weight: 800; color: #0b1622; border: 2px solid #0b1622; }

.regeltext { flex: 1; padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 8px; }

/* Bewegung */
.muenze { position: absolute; z-index: 9; font-size: 16px; margin: -9px 0 0 -9px; pointer-events: none; animation: muenze 1.2s cubic-bezier(.5,0,.8,.6) both; }
@keyframes muenze { 0% { transform: translate(0,0) scale(.4); opacity: 0; } 15% { transform: translate(0,-14px) scale(1.1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(.7); opacity: .9; } }

@keyframes pling { 40% { transform: scale(1.08); border-color: var(--gold); box-shadow: 0 0 16px rgba(242,193,78,.6); } }

/* Meine Airline */
.meine-reihe { display: flex; gap: 8px; width: 100%; flex: 1; min-height: 0; }
.meine-spalte { width: 196px; flex: none; background: var(--tafel); border: 1px solid var(--linie); border-radius: 14px; padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; touch-action: pan-y; }

.spaltentitel { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--blass); }
.namensfeld { font: inherit; font-size: 16px; font-weight: 800; color: var(--text); background: rgba(255,255,255,.08); border: 1px solid var(--linie); border-radius: 9px; padding: 6px 8px; width: 100%; box-sizing: border-box; -webkit-user-select: text; user-select: text; }
.farben { display: flex; gap: 6px; }
.farbpunkt { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; }

.art-bild { height: 64px; display: grid; place-items: center; font-size: 30px; background: rgba(255,255,255,.05); overflow: hidden; }

.profilwahl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }

.details { border-radius: 10px; background: rgba(255,255,255,.035); }
.details-kopf { width: 100%; text-align: left; padding: 7px 9px; font-size: 11.5px; font-weight: 700; color: var(--blass); display: flex; gap: 6px; align-items: center; }
.details .pfeilchen { display: inline-block; transition: transform .15s; }

.details-rumpf { display: none; padding: 0 8px 8px; flex-direction: column; gap: 6px; }

.angebot { align-items: flex-start; border-color: rgba(242,193,78,.35); }

.angebot .plus { color: #4ADE80; font-weight: 800; font-size: 11.5px; white-space: nowrap; }
.angebot .kostet { color: #EAF2F8; white-space: nowrap; }
.angebot .grund { display: block; line-height: 1.25; margin-top: 1px; font-style: italic; }
.heimatwahl .legende { justify-content: center; margin-top: 3px; font-weight: 400; }
.grundsatz { display: grid; grid-template-columns: 20px 92px 1fr; align-items: center; gap: 4px; }
.grundsatz.aus { opacity: .35; pointer-events: none; }
.gs-icon { font-size: 15px; text-align: center; }
.gs-name { font-size: 11.5px; font-weight: 600; }
.segment.klein { padding: 2px; gap: 2px; border-radius: 8px; }
.segment.klein button { padding: 4px 1px; font-size: 10.5px; border-radius: 6px; }
.wirkung { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: rgba(242,193,78,.08); border: 1px solid rgba(242,193,78,.3); border-radius: 10px; padding: 5px; margin-top: 2px; }
.wirkung div { display: flex; flex-direction: column; align-items: center; gap: 1px; }
.wirkung small { font-size: 9.5px; color: var(--blass); white-space: nowrap; }
.wirkung b { font-size: 11.5px; color: var(--gold); letter-spacing: 1px; white-space: nowrap; }
.assist { display: flex; flex-direction: column; gap: 5px; background: rgba(255,255,255,.04); border-radius: 10px; padding: 6px; }
.assist-kopf { display: flex; gap: 6px; align-items: center; font-size: 12px; }
.kandidat { display: flex; align-items: center; gap: 6px; }
.kandidat .mitte { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.gesicht.klein-gesicht { width: 32px; height: 32px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; flex: none; background: #2c4a63; font-weight: 800; font-size: 14px; }
.gesicht.klein-gesicht img { width: 100%; height: 100%; object-fit: cover; }

.berichtknopf.neu { border-color: var(--gold); animation: atmen 1.6s ease-in-out infinite; }
.bericht-kopf { display: flex; gap: 8px; align-items: center; }
.bericht-kopf b { display: block; font-size: 12px; }
.bericht-kopf small { font-size: 10px; }
.vorschlag { display: flex; flex-direction: column; gap: 5px; background: rgba(255,255,255,.05); border-radius: 10px; padding: 7px; }

.gegnerwahl { display: flex; flex-direction: column; align-items: center; gap: 6px; }

.gegner-reihe { display: flex; gap: 10px; }
.gegner { width: 190px; min-height: 84px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 10px;

#drehen { position: fixed; inset: 0; z-index: 100; display: none; place-content: center; justify-items: center; gap: 14px; text-align: center;
  background: var(--nacht); padding: 24px; font-size: 18px; font-weight: 600; }
#drehen .telefon { width: 46px; height: 80px; border: 3px solid var(--gold); border-radius: 10px; animation: drehen 2s ease-in-out infinite; }
@keyframes drehen { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
@media (orientation: portrait) and (max-width: 700px) { #drehen { display: grid; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01s !important; transition: none !important; } }

/* Kein Seitenzoom wie im Browser: nur die Karte zoomt selbst. */
html, body { touch-action: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
/* Hinweis auf eine neue Version, oben mittig. */
.update { position: fixed; left: 50%; top: calc(8px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 90; display: flex; align-items: center; gap: 10px;
  background: #F2C14E; color: #0B1622; font-weight: 800; font-size: 13px; border-radius: 999px; padding: 6px 6px 6px 14px; box-shadow: 0 6px 20px rgba(0,0,0,.45); }
.update button { font: inherit; border: 0; border-radius: 999px; background: #0B1622; color: #F2C14E; padding: 6px 12px; cursor: pointer; }

/* Unten links: Rivalen einzeln auf der Karte zeigen. */
.rivalenknopf { position: absolute; left: calc(6px + var(--sl)); bottom: calc(8px + var(--sb)); z-index: 5; height: 32px; display: flex; align-items: center; gap: 2px; padding: 0 3px 0 8px;
  background: var(--tafel); border: 1px solid var(--linie); border-radius: 999px; color: var(--blass); font: 600 11px 'Outfit', system-ui, sans-serif; }
.rivalenknopf > span { margin-right: 2px; }
.rivalenknopf.an { border-color: rgba(242,193,78,.6); color: var(--text); }
